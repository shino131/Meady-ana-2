/* Layout: ticket-style cards (time stub + body), grouped by day; list / week strip / month grid views */
:root {
  --bg: #e8eee9; --surface: #f5f8f4; --surface2: #dde6df; --line: #c3d0c6;
  --fg: #14221b; --muted: #5a6e63; --accent: #b4531a; --accent-ink: #ffffff;
  --now: #0f8a63; --late: #c23b32; --prio1: #a86a12; --prio2: #c23b32;
  --shadow: 0 1px 0 rgba(20,34,27,.04), 0 8px 24px -12px rgba(20,34,27,.25);
  direction: rtl; --r: 14px; --overlay: rgba(5, 12, 9, .55);
  --font-family: 'KF Plex', system-ui, 'Segoe UI', Tahoma, Arial, sans-serif; --font-size: 16px;
  --f-body: var(--font-family);
  --f-display: var(--font-display, var(--font-family));
  --f-num: 'KF Digits', var(--f-display);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1713; --surface: #16241e; --surface2: #1e3028; --line: #2b4237;
    --fg: #e6eee8; --muted: #8aa196; --accent: #e58b4c; --accent-ink: #1a0f06;
    --now: #3ed19e; --late: #f0716a; --prio1: #e3b04b; --prio2: #f0716a;
    --shadow: 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1713; --surface: #16241e; --surface2: #1e3028; --line: #2b4237;
  --fg: #e6eee8; --muted: #8aa196; --accent: #e58b4c; --accent-ink: #1a0f06;
  --now: #3ed19e; --late: #f0716a; --prio1: #e3b04b; --prio2: #f0716a;
  --shadow: 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-block: 14px 90px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background .3s, color .3s; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; position: relative; color: var(--accent); flex: none; }
.logo::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px dashed var(--line); }
.logo svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; line-height: 1; letter-spacing: .5px; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: .86rem; }
.tools { display: flex; gap: 8px; }
.btn-i { width: 44px; height: 44px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; transition: transform .15s, background .2s; }
.btn-i:hover { background: var(--surface2); transform: translateY(-1px); }
.btn-i:active { transform: scale(.95); }

/* quick add */
.quick { display: flex; gap: 8px; }
.quick input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.quick input::placeholder { color: var(--muted); }
.btn-p { height: 52px; padding: 0 20px; border: 0; border-radius: var(--r); background: var(--accent); color: var(--accent-ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow); transition: transform .15s, filter .2s; }
.btn-p:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-s { height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-s:hover { background: var(--surface2); }
.btn-d { color: var(--late); border-color: color-mix(in srgb, var(--late) 40%, var(--line)); }
.hint { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -6px; min-height: 0; }
.hint:empty { display: none; }
.hint .chip { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; padding: 4px; gap: 2px; background: var(--surface2); border-radius: calc(var(--r) + 2px); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: var(--r); font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button[aria-pressed="true"], .seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.15); font-weight: 600; }
.search { position: relative; flex: 1; min-width: 160px; max-width: 280px; }
.search input { width: 100%; height: 44px; padding: 0 40px 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.search .ic { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.cat .cn { font-family: var(--f-display); font-size: .8rem; color: var(--muted); }
.cat.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.cat.on .cn { color: inherit; opacity: .7; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }

/* sections */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; padding-inline: 4px; }
.sec-h h2 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; }
.sec-h small { color: var(--muted); }
.sec-h .ct { margin-inline-start: auto; font-family: var(--f-num); color: var(--muted); font-size: .85rem; }
.sec-h.late h2 { color: var(--late); }
.sec-h.today h2 { color: var(--now); }
.sec-h button { border: 0; background: none; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; padding: 0; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }

/* ticket */
.ticket { font-size: var(--font-size); display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: relative; overflow: hidden; box-shadow: var(--shadow); transition: transform .2s, opacity .3s; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.ticket:hover { transform: translateY(-2px); }
.stub { position: relative; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1px; border-inline-end: 2px dashed var(--line); background: var(--surface2); }
.stub::before, .stub::after { content: ""; position: absolute; inset-inline-end: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.stub::before { top: -9px; } .stub::after { bottom: -9px; }
.t-time { font-family: var(--f-num); font-weight: 900; font-size: 1.55em; line-height: 1.05; letter-spacing: -.5px; direction: ltr; font-variant-numeric: tabular-nums; }
.t-ap { font-size: .72em; font-weight: 600; color: var(--muted); letter-spacing: .5px; }
.t-day { margin-top: 5px; font-size: .74em; color: var(--muted); line-height: 1.25; }
.st-now .stub { background: color-mix(in srgb, var(--now) 18%, var(--surface)); }
.st-now .t-time { color: var(--now); }
.st-now { border-color: color-mix(in srgb, var(--now) 55%, var(--line)); animation: rise .35s ease both, pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: var(--shadow), 0 0 0 0 color-mix(in srgb, var(--now) 35%, transparent); } 50% { box-shadow: var(--shadow), 0 0 0 6px color-mix(in srgb, var(--now) 0%, transparent); } }
.st-late .stub { background: color-mix(in srgb, var(--late) 14%, var(--surface)); }
.st-late .t-time { color: var(--late); }
.done { opacity: .55; }
.done .t-title { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.t-body { padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.t-title { font-weight: 600; font-size: 1.04em; line-height: 1.4; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t-title.open, .t-notes.open { -webkit-line-clamp: unset; display: block; }
.t-notes { color: var(--muted); font-size: .9em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.more { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--accent); font-size: .82em; font-weight: 500; display: none; gap: 4px; align-items: center; }
.more.vis { display: inline-flex; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .78em; color: var(--muted); max-width: 100%; }
.chip .ic { width: 13px; height: 13px; }
.chip.rel { font-weight: 600; color: var(--fg); }
.st-now .chip.rel { color: var(--now); border-color: var(--now); }
.st-late .chip.rel { color: var(--late); border-color: var(--late); }
.t-act { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px 8px 8px 6px; gap: 6px; }
.chk { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; color: transparent; transition: all .2s; }
.chk:hover { border-color: var(--now); color: var(--now); }
.done .chk { background: var(--now); border-color: var(--now); color: var(--bg); }
.kb { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; color: var(--muted); }
.kb:hover { background: var(--surface2); color: var(--fg); }
.ticket.sortable-ghost { opacity: .35; }
.ticket.compact { grid-template-columns: 62px minmax(0, 1fr) auto; }
.compact .t-time { font-size: 1.05em; }
.compact .t-day, .compact .t-notes { display: none; }
.compact .t-body { padding: 8px 9px; gap: 5px; }
.compact .t-title { font-size: .92em; }
.compact .stub { padding: 8px 4px; }
.compact .t-act { padding: 4px; }
.compact .chk, .compact .kb { width: 28px; height: 28px; }

/* empty */
.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty .ic { width: 38px; height: 38px; color: var(--accent); }
.empty b { color: var(--fg); font-family: var(--f-display); font-size: 1.1rem; }

/* week */
.wk-nav { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.wk-nav h2 { margin: 0; font-family: var(--f-display); font-size: 1.1rem; text-align: center; flex: 1; }
.week { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 10px; scrollbar-width: thin; }
.wcol { flex: 0 0 min(78vw, 250px); scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: calc(var(--r) + 4px); padding: 8px; min-height: 280px; background: color-mix(in srgb, var(--surface) 45%, var(--bg)); }
.wcol.today { border-color: var(--now); box-shadow: 0 0 0 1px var(--now) inset; }
.wcol-h { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; }
.wcol-h b { font-family: var(--f-display); font-size: 1rem; }
.wcol-h .dn { font-family: var(--f-num); font-weight: 900; font-size: 1.5rem; color: var(--muted); line-height: 1; }
.wcol.today .dn { color: var(--now); }
.wcol-l { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 80px; }
.wadd { border: 1px dashed var(--line); background: transparent; border-radius: var(--r); color: var(--muted); padding: 6px; display: inline-flex; justify-content: center; gap: 6px; align-items: center; font-size: .85rem; }
.wadd:hover { color: var(--accent); border-color: var(--accent); }
.wnote { color: var(--muted); font-size: .8rem; text-align: center; }

/* month */
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mh { text-align: center; font-size: .8rem; color: var(--muted); padding: 4px 0; font-weight: 500; }
.mday { aspect-ratio: 1 / 1.05; min-height: 52px; border: 1px solid var(--line); border-radius: calc(var(--r) - 4px); background: var(--surface); padding: 5px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
.mday:hover { background: var(--surface2); }
.mday.out { opacity: .35; }
.mday.today { border-color: var(--now); box-shadow: 0 0 0 1px var(--now) inset; }
.mday.sel { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.mday .dn { font-family: var(--f-num); font-weight: 700; font-size: .95rem; }
.mdots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 8px; align-items: center; }
.mdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--accent)); }
.mdots em { font-style: normal; font-size: .65rem; font-family: var(--f-num); }

/* overlays */
.ov { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(3px); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; max-height: 92dvh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 26px 26px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); animation: up .3s cubic-bezier(.2,.9,.3,1) both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }

@media (min-width: 700px) { .ov { align-items: center; } .sheet { border-radius: 26px; } }
.sh-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sh-h h3 { margin: 0; font-family: var(--f-display); font-size: 1.3rem; }
.fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0; }
.fld > label, .lbl { font-size: .85rem; color: var(--muted); font-weight: 500; }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 46px; padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); }
.fld textarea { resize: vertical; min-height: 76px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.acts { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.acts .btn-p { flex: 1; justify-content: center; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { border: 1px solid var(--line); background: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 500; }
.pills button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.menu { position: fixed; z-index: 60; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 20px 50px -10px rgba(0,0,0,.45); padding: 6px; animation: fade .15s ease both; max-height: 70dvh; overflow: auto; }
.menu button, .menu a { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: transparent; border-radius: calc(var(--r) - 4px); text-align: start; text-decoration: none; color: inherit; font-size: .95rem; }
.menu button:hover, .menu a:hover { background: var(--surface2); }
.menu .dg { color: var(--late); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu .mt { padding: 6px 12px 2px; font-size: .75rem; color: var(--muted); }
.toast { position: fixed; z-index: 90; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 14px 40px -8px rgba(0,0,0,.5); max-width: calc(100vw - 32px); animation: rise .25s ease both; font-weight: 500; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; filter: brightness(1.25); }
.toast.alarm { border: 2px solid var(--accent); padding: 14px 18px; }

/* settings */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--c); }
.sw.on { box-shadow: 0 0 0 3px var(--fg); }
.glist { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.glist li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }

.glist input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; background: none; border-radius: 50%; }

.hist ul { margin: 6px 0 0; padding-inline-start: 18px; color: var(--muted); font-size: .9rem; }
.ta { width: 100%; min-height: 120px; direction: ltr; font-family: ui-monospace, monospace; font-size: .8rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 10px; }
footer { text-align: center; color: var(--muted); font-size: .8rem; }

/* layout: side panel on wide screens, bottom dock on phones */

.mainc { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.panel { display: flex; flex-direction: column; gap: 14px; }
.panel .seg { display: flex; width: 100%; }
.panel .seg button { flex: 1; justify-content: center; padding-inline: 8px; }
.panel .search { max-width: none; width: 100%; flex: none; }
.panel .cats { flex-direction: column; overflow: visible; gap: 6px; }
.panel .cat { width: 100%; justify-content: flex-start; border-radius: var(--r); padding: 10px 14px; }
.panel .cat .cn { margin-inline-start: auto; }
#side .seg button .ic { display: none; }
.side-t { font-family: var(--f-display); font-weight: 700; font-size: .9rem; color: var(--muted); margin-bottom: -6px; }
.dock { display: none; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 260px minmax(0, 1fr); }
  .side { display: block; position: sticky; top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r) + 6px); padding: 14px; box-shadow: var(--shadow); max-height: calc(100dvh - 28px); overflow: auto; }
}
@media (max-width: 899px) {
  body { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

  .dock button { flex: 1; border: 0; background: transparent; border-radius: 16px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 500; color: var(--muted); position: relative; }
  .dock button .ic { width: 22px; height: 22px; }

  .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

function parseQuick(raw) {

  let m;

  else if ((m = cut(/غد[اً]|بكرة|بكره/))) { date = ymd(addDays(new Date(), 1)); chips.push('غداً'); }
  else if ((m = cut(/اليوم/))) { date = ymd(new Date()); chips.push('اليوم'); }
  else {
    for (let i = 0; i < 7; i++) {
      if (new RegExp('(?:^|\\s)(?:يوم\\s*)?' + AR_DAYS[i] + '(?![\\u0600-\\u06FF])').test(s)) {
        s = s.replace(new RegExp('(?:يوم\\s*)?' + AR_DAYS[i]), ' ');

      }
    }
  }

  const re = new RegExp('(?:الساعة|الساعه)\\s*(\\d{1,2})(?::(\\d{2}))?\\s*' + mark + '?|(\\d{1,2}):(\\d{2})\\s*' + mark + '?|(\\d{1,2})\\s*' + mark + '(?![\\u0600-\\u06FF])');

    let h = +(m[1] || m[4] || m[6]), mi = +(m[2] || m[5] || 0), mk = m[3] || m[7] || m[8] || '';
    if (h <= 24 && mi < 60) {

      else if (/^(ص|صباح)/.test(mk)) { if (h === 12) h = 0; }

    await C.backup.restore(o.data);
    if (o.settings) {

      if (Array.isArray(s.themes)) st.themes = s.themes.slice(0, 12).map(cleanTheme).filter(Boolean); st.themeId = st.themes.some(t => t.id === s.themeId) ? s.themeId : 'base';

  }
  function renderAll() {
    const ff = $i('kitFont'); if (ff) ff.innerHTML = FONTS.map(f => `<option value="${f[0]}"${f[0] === st.font ? ' selected' : ''}>${kesc(f[1])}</option>`).join('');

  function init() { load(); apply(); bkLabel(); }
  /* ربط الأقسام الموجودة حاليًا في الصفحة (تُستدعى كلما فُتح تبويب) */
  function bind() {

    on('kitFont', e => e.onchange = ev => { st.font = ev.target.value; save(); apply(); });
    on('kitSize', e => e.onchange = ev => { st.size = +ev.target.value; save(); apply(); });
    on('kitThemes', e => e.onclick = ev => {
      const d = ev.target.closest('[data-d]');
      if (d) { if (!d.classList.contains('arm')) { d.classList.add('arm'); d.textContent = 'تأكيد'; return; } st.themes = st.themes.filter(t => t.id !== d.dataset.d); if (st.themeId === d.dataset.d) st.themeId = 'base'; save(); apply(); renderThemes(); window.onKitTheme && window.onKitTheme(); return; }
      const b = ev.target.closest('[data-t]'); if (!b) return; if (b.dataset.t !== 'base' && !st.themes.some(t => t.id === b.dataset.t)) return;
      st.themeId = b.dataset.t; save(); apply(); renderThemes(); window.onKitTheme && window.onKitTheme();
    });
    on('kitThemeIn', e => e.onclick = () => $i('kitThemeFile').click());
    on('kitThemeFile', e => e.onchange = () => { const f = e.files[0]; e.value = ''; importTheme(f); });
    on('kitThemeTpl', e => e.onclick = async () => {
      const tpl = { app: C.appId + '-theme', version: 1, themes: [{ name: 'اسم الثيم', description: 'وصف قصير', scheme: 'light', colors: { ...C.baseTheme } }] };
      const r = await saveBlob(new Blob([JSON.stringify(tpl, null, 1)], { type: 'application/json' }), C.appId + '-theme-template.json', 'ملف ثيم (JSON)');
      say('kitThemeMsg', r === 'ok' ? 'تم حفظ الملف النموذجي. عدّل الألوان ثم استورده.' : 'أُلغي الحفظ.', r !== 'ok');
    });

  }

})();

/* ============ sheets, menus, settings ============ */
const layer = $('#layer');

function openSheet(html, wide) {

}
function closeMenu() { $$('.menu').forEach(m => m.remove()); }
function placeMenu(m, r) {
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  let left = r.left, top = r.bottom + 6;
  if (left + w > innerWidth - 10) left = innerWidth - w - 10; if (left < 10) left = 10;
  if (top + h > innerHeight - 10) top = Math.max(10, r.top - h - 6);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  setTimeout(() => document.addEventListener('pointerdown', function f(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('pointerdown', f); } }), 0);
}
const snapshot = () => JSON.stringify(S.appts);
function undoable(msg, snap) { toast(msg, 'تراجع', () => { S.appts = JSON.parse(snap); save(); render(); }); }
function focusDate(k) { const d = fromYmd(k); ui.sel = k; ui.wk = weekStartOf(d); ui.mo = { y: d.getFullYear(), m: d.getMonth() }; }

/* ---- appointment sheet ---- */

    <div class="fld"><label for="f-notes">ملاحظات</label><textarea id="f-notes" placeholder="اختياري">${esc(v.notes)}</textarea></div>

/* ---- actions ---- */
function toggleDone(a) {
  const sn = snapshot();
  if (!a.done && a.repeat !== 'none') {
    a.date = nextDate(a); a.fired = ''; sfx('done'); save(); render();
    undoable(`تم. الموعد التالي ${fullDate(fromYmd(a.date))}`, sn); return;
  }
  a.done = !a.done; save(); render(); if (a.done) sfx('done'); if (a.done) undoable('تم إنجاز الموعد', sn);
}
function snooze(a, ms) { const sn = snapshot(); const d = new Date(+dtOf(a) + ms); a.date = ymd(d); a.time = `${pad(d.getHours())}:${pad(d.getMinutes())}`; a.fired = ''; a.done = false; save(); render(); undoable(`تم التأجيل إلى ${fullDate(d)} ${t12(a.time).t} ${t12(a.time).ap}`, sn); }
function gcalUrl(a) {
  const s = dtOf(a), e = new Date(+s + (a.dur || 60) * 60000), f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const q = { action: 'TEMPLATE', text: a.title, dates: `${f(s)}/${f(e)}`, details: a.notes || '', location: a.place || '' };
  if (a.repeat !== 'none') q.recur = 'RRULE:FREQ=' + a.repeat.toUpperCase();
  return 'https://calendar.google.com/calendar/render?' + Object.entries(q).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('تم نسخ الموعد'); }
  catch (e) { try { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); toast('تم نسخ الموعد'); } catch (e2) { toast('تعذّر النسخ'); } }
}
function shareText(a) { const d = dtOf(a); return `${a.title}\n${fullDate(d)} · ${t12(a.time).t} ${t12(a.time).ap}${a.place ? '\n' + a.place : ''}${a.notes ? '\n' + a.notes : ''}`; }
function openMenu(btn, a) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = `<button data-m="edit">${ic('edit')}تعديل الموعد</button><button data-m="done">${ic('check')}${a.done ? 'إلغاء الإنجاز' : 'تم الإنجاز'}</button><hr><div class="mt">تأجيل</div>
  <button data-m="s1">${ic('snooze')}بعد ساعة</button><button data-m="s2">${ic('snooze')}إلى الغد</button><button data-m="s3">${ic('snooze')}بعد أسبوع</button><hr>
  <a href="${esc(gcalUrl(a))}" target="_blank" rel="noopener">${ic('cal')}إضافة إلى Google Calendar</a><button data-m="copy">${ic('share')}نسخ نص الموعد</button><hr><button class="dg" data-m="del">${ic('trash')}حذف الموعد</button>`;

/* ---- theme ---- */
const mqDark = matchMedia('(prefers-color-scheme: dark)');
function isDark() { return S.cfg.theme === 'dark' || (S.cfg.theme === 'auto' && mqDark.matches); }
function applyCfg() {
  const r = document.documentElement, c = S.cfg, ac = ACCENTS[c.accent] || ACCENTS[0];
  if (c.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', c.theme);
  if (KIT.active()) { r.style.removeProperty('--accent'); r.style.removeProperty('--accent-ink'); }
  else { r.style.setProperty('--accent', isDark() ? ac.d : ac.l); r.style.setProperty('--accent-ink', isDark() ? '#14110d' : '#ffffff'); }

}

    $$('select[data-k]', b).forEach(el => el.onchange = () => { sn[el.dataset.k] = el.value; save(); if (c.sound && el.value !== 'off') playTone(el.value, sn.vol); });
    $$('[data-p]', b).forEach(el => el.onclick = () => { const id = sn[el.dataset.p]; if (id && id !== 'off') playTone(id, sn.vol); });
    $('#p-rep').onclick = e => { const x = e.target.closest('button'); if (!x) return; sn.repeat = +x.dataset.i + 1; save(); tabBody(); sfx('remind'); };
  } else if (setTab === 'bk') {
    b.innerHTML = `${KIT_BACKUP_HTML}
    <div class="kit-sec"><span class="lbl">استيراد من تطبيق قديم</span><p class="note" style="margin:0">لنسخ DO X القديمة أو نسخ ميعاد المحفوظة قبل هذا الإصدار.</p><div class="kit-row"><label class="btn sm" for="oldFile" style="display:inline-flex;align-items:center;cursor:pointer">اختيار ملف</label></div><input id="oldFile" type="file" accept=".json,application/json" hidden><div id="impBox"></div></div>`;
    KIT.bind();
    if (S.appts.some(a => a.ex)) { b.insertAdjacentHTML('beforeend', `<div class="kit-sec"><span class="lbl">الأمثلة التجريبية</span><p class="note" style="margin:0">المواعيد التي تحمل وسم «مثال» تجريبية.</p><div class="kit-row"><button type="button" class="btn sm" id="rmEx">${ic('trash')}حذف الأمثلة</button></div></div>`); $('#rmEx').onclick = () => { const sn = snapshot(); S.appts = S.appts.filter(x => !x.ex); save(); render(); tabBody(); undoable('تم حذف الأمثلة', sn); }; }
    $('#oldFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => stageImport(String(r.result)); r.readAsText(f); e.target.value = ''; };
  } else {
    b.innerHTML = `<ul class="hist">${HISTORY.map(h => `<li><b>الإصدار ${h.v}</b> <small style="color:var(--muted)">${h.d}</small><ul>${h.items.map(i => `<li>${i}</li>`).join('')}</ul></li>`).join('')}</ul>`;
  }
}
function stageImport(txt) {
  const box = $('#impBox'); let o;
  try { o = JSON.parse(txt); } catch (e) { box.innerHTML = '<p class="note" style="color:var(--late)">الملف غير صالح. تأكد أنه نسخة احتياطية بصيغة JSON.</p>'; return; }
  if (o && Array.isArray(o.groups)) {
    const appts = [];
    o.groups.forEach(g => (g.tasks || []).forEach(t => appts.push({ id: uid(), title: String(t.text || '').slice(0, 300) || 'مهمة', date: ymd(new Date()), time: '08:00', done: !!t.completed })));
    box.innerHTML = `<div class="empty" style="margin-top:12px"><b>نسخة DO X</b><span>${appts.length} مهمة. ستُضاف كمواعيد اليوم الساعة 8 ص.</span><button class="btn-p" id="impAdd" type="button">إضافة إلى بياناتي</button></div>`;
    $('#impAdd').onclick = () => { const n = normalize({ appts }); S.appts.push(...n.appts); save(); render(); closeSheet(); toast('تم استيراد ' + n.appts.length + ' موعد'); };
    return;
  }
  const n = normalize(o && Array.isArray(o.appts) ? { appts: o.appts, cfg: o.cfg } : null);
  if (!n) { box.innerHTML = '<p class="note" style="color:var(--late)">لم أجد مواعيد في هذا الملف.</p>'; return; }
  box.innerHTML = `<div class="empty" style="margin-top:12px"><b>نسخة ميعاد</b><span>${n.appts.length} موعد.</span><div class="acts" style="justify-content:center"><button class="btn-p" id="impRep" type="button" style="flex:none">استبدال بياناتي</button><button class="btn-s" id="impMerge" type="button">إضافة إلى الحالية</button></div></div>`;
  $('#impRep').onclick = () => { S.appts = n.appts; S.cfg = n.cfg; save(); applyCfg(); render(); closeSheet(); toast('تم استبدال البيانات'); };
  $('#impMerge').onclick = () => { const have = new Set(S.appts.map(a => a.id)); n.appts.forEach(a => { if (!have.has(a.id)) S.appts.push(a); }); save(); render(); closeSheet(); toast('تمت الإضافة'); };
}
/* ============ events + boot ============ */
const apptOf = el => { const t = el.closest('.ticket'); return t && S.appts.find(a => a.id === t.dataset.id); };
$('#main').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, a = apptOf(b);
  if (act === 'more') { e.stopPropagation(); const c = b.closest('.ticket'), open = !$('.t-title', c).classList.contains('open'); $$('.t-title,.t-notes', c).forEach(x => x.classList.toggle('open', open)); b.innerHTML = ic(open ? 'down' : 'down') + (open ? 'عرض أقل' : 'عرض المزيد'); return; }
  if (act === 'edit' && a) return openEdit(a);
  if (act === 'done' && a) return toggleDone(a);
  if (act === 'menu' && a) return openMenu(b, a);
  if (act === 'new') return openEdit(null);
  if (act === 'newOn') return openEdit(null, { date: b.dataset.date });
  if (act === 'toggleLate') { ui.lateOpen = !ui.lateOpen; return render(); }
  if (act === 'toggleDone') { ui.doneOpen = !ui.doneOpen; return render(); }
  if (act === 'rmex') { const sn = snapshot(); S.appts = S.appts.filter(x => !x.ex); save(); render(); return undoable('تم حذف الأمثلة', sn); }
  if (act === 'wprev') ui.wk = addDays(ui.wk, -7);
  else if (act === 'wnext') ui.wk = addDays(ui.wk, 7);
  else if (act === 'wtoday') ui.wk = weekStartOf(new Date());
  else if (act === 'mprev') ui.mo = ui.mo.m ? { y: ui.mo.y, m: ui.mo.m - 1 } : { y: ui.mo.y - 1, m: 11 };
  else if (act === 'mnext') ui.mo = ui.mo.m < 11 ? { y: ui.mo.y, m: ui.mo.m + 1 } : { y: ui.mo.y + 1, m: 0 };
  else if (act === 'mtoday') { focusDate(ymd(new Date())); }
  else if (act === 'pick') ui.sel = b.dataset.date;
  render();
});
$('#main').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('ticket')) { const a = apptOf(e.target); if (a) openEdit(a); } });
document.addEventListener('click', e => {
  const t = e.target;
  const vw = t.closest('[data-v]'), fl = t.closest('[data-f]'), fb = t.closest('[data-act="filters"]');
  if (vw) { S.cfg.view = vw.dataset.v; save(); return render(); }
  if (fl) { ui.filter = fl.dataset.f; return render(); }
  if (fb) openSheet(`<div class="sh-h"><h3>التصفية والعرض</h3><button class="btn-i" id="xs" type="button" aria-label="إغلاق">${ic('x')}</button></div><div id="fpanel">${panelHTML()}</div><div class="acts"><button class="btn-p" id="fdone" type="button">${ic('check')}<span>عرض النتائج</span></button></div>`);
  if (fb) { $('#xs').onclick = $('#fdone').onclick = closeSheet; }
});
document.addEventListener('input', e => {
  if (!e.target.classList.contains('q-input')) return;
  ui.q = e.target.value; $$('.q-input').forEach(x => { if (x !== e.target) x.value = ui.q; }); renderMain();
  const bd = $('#dock [data-act="filters"]'); if (bd) { const on = ui.filter !== 'all' || ui.q.trim(); bd.querySelector('.bd')?.remove(); if (on) bd.insertAdjacentHTML('beforeend', '<i class="bd"></i>'); }
});
$('#btnSettings').addEventListener('click', () => openSettings());
$('#btnTheme').addEventListener('click', () => { const dark = KIT.scheme() ? KIT.scheme() === 'dark' : isDark(); KIT.reset(); S.cfg.theme = dark ? 'light' : 'dark'; save(); applyCfg(); render(); });

const qi = $('#quickInput');
qi.addEventListener('input', () => { const p = parseQuick(qi.value); $('#quickHint').innerHTML = qi.value.trim() && p.chips.length ? p.chips.map(c => `<span class="chip">${esc(c)}</span>`).join('') + `<span class="chip" style="border:0;background:none">سيُضاف مباشرة</span>` : ''; });
$('#quickForm').addEventListener('submit', e => {
  e.preventDefault();
  const raw = qi.value.trim();
  if (!raw) { qi.focus(); qi.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 250 }); return; }
  const p = parseQuick(raw); qi.value = ''; $('#quickHint').innerHTML = '';
  if (p.date || p.time) {
    const d = p.date || ymd(new Date()), t = p.time || '08:00';
    S.appts.push({ id: uid(), title: p.title, date: d, time: t, place: '', notes: '', repeat: 'none', remind: 30, done: false, ex: false, fired: '', dur: 60, created: Date.now() });
    save(); focusDate(d); render(); sfx('add'); toast(`أُضيف: ${fullDate(fromYmd(d))} ${t12(t).t} ${t12(t).ap}`, 'تعديل', () => openEdit(S.appts[S.appts.length - 1]));
  } else openEdit(null, { title: p.title });
});

/* boot */
document.documentElement.setAttribute('dir', 'rtl'); document.documentElement.setAttribute('lang', 'ar');
S = loadLocal() || normalize(seed());
KIT.init(); applyCfg(); render(); updateFoot(); tickReminders();
setInterval(() => { if (document.hidden) return; tickReminders(); if (!$('#ov') && !$('.menu')) renderMain(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickReminders(); render(); } });
initRemote();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });</script>
